<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA RAIDADO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05000a; 
            color: #e2d9ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            text-align: center;
            cursor: pointer;
        }

        .container {
            max-width: 650px;
            width: 100%;
            padding: 60px 40px;
            background: rgba(10, 3, 18, 0.95);
            border: 1px solid #bc13fe; 
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.35);
            backdrop-filter: blur(12px);
            animation: fadeIn 1.2s ease-out;
        }

        /* ----- EFEITO GLITCH NO TÍTULO ----- */
        .glitch {
            font-size: 2.7rem;
            font-weight: 900;
            color: #bc13fe;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            position: relative;
            text-shadow: 0 0 15px rgba(188, 19, 254, 0.6);
            animation: mainGlow 3s infinite alternate;
        }

        .glitch::before,
        .glitch::after {
            content: "Seu Servidor Foi Raidado";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            left: 3px;
            text-shadow: -3px 0 #ff00ff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 4s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -3px;
            text-shadow: -2px 0 #00ffff, 0 2px #bc13fe;
            clip: rect(85px, 450px, 140px, 0);
            animation: glitch-anim2 4s infinite linear alternate-reverse;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.7;
            color: #b3a2c2;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 28px;
            background: rgba(188, 19, 254, 0.15);
            border: 1px solid #bc13fe;
            color: #bc13fe;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
        }

        /* ----- ANIMAÇÕES ----- */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes mainGlow {
            from { text-shadow: 0 0 12px rgba(188, 19, 254, 0.5); }
            to { text-shadow: 0 0 25px rgba(188, 19, 254, 0.8), 0 0 8px #fff; }
        }

        @keyframes glitch-anim {
            0% { clip: rect(20px, 9999px, 60px, 0); transform: skew(0.4deg); }
            5% { clip: rect(75px, 9999px, 10px, 0); transform: skew(0.8deg); }
            10% { clip: rect(40px, 9999px, 120px, 0); transform: skew(-0.5deg); }
            15% { clip: rect(0px, 0px, 0px, 0); }
            100% { clip: rect(0px, 0px, 0px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); transform: skew(-0.7deg); }
            7% { clip: rect(15px, 9999px, 80px, 0); transform: skew(0.5deg); }
            12% { clip: rect(90px, 9999px, 140px, 0); transform: skew(-0.2deg); }
            18% { clip: rect(0px, 0px, 0px, 0); }
            100% { clip: rect(0px, 0px, 0px, 0); }
        }
    </style>
</head>
<body>

    <!-- Efeitos sonoros de aviso e glitch eletrónico -->
    <audio id="ambientAlarm" loop>
        <source src="https://mixkit.co" type="audio/wav">
    </audio>
    <audio id="glitchSound">
        <source src="https://mixkit.co" type="audio/wav">
    </audio>

    <div class="container">
        <!-- Título com efeito glitch hacker -->
        <h1 class="glitch">Seu Servidor Foi Raidado</h1>
        
        <!-- Mensagem de Texto Princípal -->
        <p>A ordem antiga ruiu. O Coelho Preto Deus saltou sobre o seu domínio e reiniciou o sistema. Nada resta além do vazio.</p>
        
        <!-- Emblema de Estado -->
        <span class="status-badge">Sistema Reiniciado</span>
    </div>

    <script>
        // Inicia o som de erro/interferência quando o utilizador clica na página
        document.body.addEventListener('click', function() {
            var alarm = document.getElementById('ambientAlarm');
            var glitch = document.getElementById('glitchSound');
            
            if (alarm.paused) {
                alarm.volume = 0.25;
                glitch.volume = 0.5;
                
                alarm.play().catch(e => console.log("Áudio ativado"));
                glitch.play().catch(e => console.log("Áudio ativado"));
            }
        }, { once: true });
    </script>

</body>
</html>
